<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torre de Leyendas — Cartas (rareza por color)</title>
<style>
/* ============================================================================
   Cartas · rareza por color.
   3 tipos (Jugador · DT · Objeto) × 4 rarezas. El color de rareza conduce
   todos los acentos vía --accent / --accent-rgb:
     Común = gris · Rara = cyan · Épica = magenta · Leyenda = dorado.
   Tipografía: pila monospace del juego (sin fuentes externas).

   Responsive: cada .slot es un contenedor (container query). La carta fija su
   font-size en cqw y TODO el interior se mide en em/% → la proporción
   contenido/carta es constante a cualquier ancho (nunca desborda). La carta
   mantiene su relación 2:3 y ocupa el 100% del hueco (rejilla auto-fit).
   Accesibilidad: cada texto lleva placa/panel oscuro propio para garantizar
   contraste sobre los fondos brillantes (no se confía solo en el contorno).
   ========================================================================== */
:root{
  /* Pila monospace idéntica a --font-game del juego (design/tokens.css). */
  --font: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --ink:#08163a;              /* navy de contorno del texto */
  --plate:rgba(4,10,28,.8);  /* placa oscura tras textos sueltos */
  --good:#6cf08a; --bad:#ff8080; --flat:#bcc8e4;
}

*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  background:#0b1020 radial-gradient(1200px 600px at 50% -10%, #16224a 0%, #0b1020 60%);
  color:#eaf0ff; font-family:var(--font);
  min-height:100vh; padding:24px clamp(10px,3vw,24px) 64px;
}
h1{ text-align:center; font-size:clamp(18px,4vw,24px); font-weight:800; letter-spacing:1px;
  color:#f4c64a; margin:4px 0; text-shadow:2px 2px 0 #000; }
.sub{ text-align:center; color:#a8b7dc; font-size:13px; margin:0 0 22px; }

/* Rejilla responsive: tantas columnas como quepan, cada carta de ancho variable. */
.row{ display:grid; gap:clamp(16px,2.6vw,30px); justify-content:center; align-items:start;
  grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.slot{ container-type:inline-size; width:100%; max-width:380px; margin-inline:auto;
  display:flex; flex-direction:column; align-items:center; gap:8px; }
.slot > .tag{ font-size:11px; color:#9aaad2; letter-spacing:1px; text-transform:uppercase; }

/* ============================ Paletas de rareza =========================== */
.rar-common{ --accent:#aeb9cf; --accent-rgb:174,185,207; }
.rar-rare  { --accent:#5fd2ff; --accent-rgb:95,210,255; }
.rar-epic  { --accent:#e884ff; --accent-rgb:232,132,255; }
.rar-legend{ --accent:#f4c64a; --accent-rgb:244,198,74; }

/* ================================ Chasis ================================== */
.card{
  position:relative; width:100%; aspect-ratio:1024/1536;
  background-size:100% 100%; background-repeat:no-repeat;
  image-rendering:pixelated; font-family:var(--font);
  font-size:4cqw;                 /* base tipográfica proporcional al ancho */
  -webkit-user-select:none; user-select:none;
}
.content{ position:absolute; inset:0; display:flex; flex-direction:column; padding:6% 6.5%; }

/* -------- Cabecera: OVR + posición / tipo / insignia DT -------- */
.head{ display:flex; justify-content:space-between; align-items:center; gap:.5em; }
.head-left{ display:flex; align-items:center; justify-content:space-between; gap:.5em; width:100%; }
.ovr{ font-size:3em; font-weight:800; line-height:.9; color:var(--accent);
  background:var(--plate); padding:.04em .2em; border-radius:.18em;
  text-shadow:-1px 0 0 var(--ink),1px 0 0 var(--ink),0 -1px 0 var(--ink),0 1px 0 var(--ink),
    0 0 14px rgba(var(--accent-rgb),.5); }
.pos-pill,.badge-dt{ font-weight:700; color:#eaf3ff; border-radius:.5em;
  border:2px solid rgba(var(--accent-rgb),.85); background:rgba(6,16,40,.7);
  box-shadow:inset 0 0 10px rgba(var(--accent-rgb),.3); }
.pos-pill{ font-size:.92em; padding:.35em .6em; }
.badge-dt{ font-size:1.15em; font-weight:800; padding:.45em .8em; }
.rarity-wrap{ display:flex; align-items:center; background:var(--plate);
  padding:.28em .5em; border-radius:.55em; }
.rarity{ font-size:1em; font-weight:800; letter-spacing:1px; line-height:1;
  color:var(--accent);}

/* -------- Retrato (Jugador / DT) -------- */
.portrait{ align-self:center; margin-top:2.5%; width:54%; aspect-ratio:1/1; padding:3px;
  background:linear-gradient(160deg, var(--accent), rgba(var(--accent-rgb),.35) 60%, rgba(var(--accent-rgb),.15));
  clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%); }
.portrait .inner{ width:100%; height:100%; overflow:hidden; position:relative;
  background:radial-gradient(circle at 50% 38%, rgba(var(--accent-rgb),.5) 0%, #0a1b44 55%, #04102b 100%);
  clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%); }
.portrait img{ width:100%; height:100%; object-fit:cover; display:block; image-rendering:pixelated; }

/* -------- Nombre: siempre sobre banda oscura propia -------- */
.namebar{ margin-top:3%; text-align:center; padding:.4em .5em;
  background:rgba(5,12,32,.62); box-shadow:inset 0 0 18px rgba(0,0,0,.35);
  border-top:2px solid rgba(var(--accent-rgb),.6); border-bottom:2px solid rgba(var(--accent-rgb),.6); }
.name{ margin:0; color:#fff; font-weight:800; font-size:1.6em; line-height:1.05; letter-spacing:.5px;
  text-shadow:0 2px 0 var(--ink), 0 0 13px rgba(var(--accent-rgb),.5); }

/* -------- Metadatos: nación + época/año -------- */
.meta{ display:flex; gap:.5em; justify-content:center; margin-top:3.5%; flex-wrap:wrap; }
.chip{ display:flex; align-items:center; gap:.4em; font-size:12px; font-weight:700; color:#eef3ff;
  padding:.3em .6em; border-radius:.5em; border:2px solid rgba(var(--accent-rgb),.65);
  background:rgba(6,16,40,.68); box-shadow:inset 0 0 7px rgba(60,120,255,.25); }
.chip .flag{ width:1.7em; height:1.15em; object-fit:cover; image-rendering:pixelated; border:1px solid rgba(0,0,0,.5); }

/* -------- Panel oscuro (stats del jugador / descripción del objeto) -------- */
.panel{ margin-top:auto; background:rgba(5,12,32,.66);
  border:2px solid rgba(var(--accent-rgb),.5); border-radius:.7em;
  box-shadow:inset 0 0 14px rgba(var(--accent-rgb),.1), 0 2px 8px rgba(0,0,0,.35);
  padding:.7em .8em; }
.stats{ display:flex; flex-direction:column; gap:.42em; }
.stat{ display:flex; align-items:center; gap:.6em; line-height:1; }
.stat-label{ width:2.5em; font-size:.95em; font-weight:800; color:#e7eeff; }
.stat-bar{ display:block; flex:1; height:.82em; border-radius:.42em; background:#0a1733; overflow:hidden;
  box-shadow:inset 0 0 0 2px #20407e; }
.stat-fill{ display:block; height:100%; background:linear-gradient(90deg,#e23b3b 0%,#f3892f 32%,#f2d23a 58%,#7be05a 100%); }
.stat-val{ width:2.3em; text-align:right; font-size:1em; font-weight:800; color:#fff; }

/* -------- Objeto: arte e info de sinergia -------- */
.art{ align-self:center; margin-top:15%; width:62%; aspect-ratio:1/1; padding:4px;
  background:linear-gradient(160deg, var(--accent), rgba(var(--accent-rgb),.4) 55%, rgba(var(--accent-rgb),.12));
  clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%); }
.art .inner{ width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:.5em;
  clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%);
  background:repeating-linear-gradient(0deg, rgba(var(--accent-rgb),.12) 0 4px, transparent 4px 8px),
    repeating-linear-gradient(90deg, rgba(var(--accent-rgb),.12) 0 4px, transparent 4px 8px),
    radial-gradient(circle at 50% 45%, rgba(var(--accent-rgb),.4) 0%, #0a1c46 72%); }
.art .icon{ font-size:3.2em; filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)); }
.art .ph{ font-size:.7em; font-weight:700; letter-spacing:1px; color:#d6e2ff; text-transform:uppercase;
  background:rgba(4,10,28,.7); padding:.3em .6em; border-radius:.5em; }
.desc-box p{ margin:0; color:#f1f5ff; font-size:15px; font-weight:600; line-height:1.32;
  text-align:center; text-wrap:balance; }
.item-synergy{ margin-top:.6em; text-align:center; font-size:13px; font-weight:700; color:var(--accent); }

/* -------- DT: sinergia y modificadores -------- */
.synergy{ display:flex; align-items:center; justify-content:center; gap:.55em; margin-top:4%;
  font-size:1.1em; font-weight:700; color:var(--accent); padding:.5em .8em; border-radius:.6em;
  border:2px solid rgba(var(--accent-rgb),.65); background:rgba(6,16,40,.66);
  box-shadow:inset 0 0 10px rgba(var(--accent-rgb),.22); }
.synergy svg{ width:1.25em; height:1.25em; flex:none; }
.mods{ display:flex; gap:.55em; margin-top:auto; }
.mod{ flex:1; text-align:center; padding:.5em .25em .6em; border-radius:.6em;
  border:2px solid rgba(var(--accent-rgb),.6); background:rgba(6,16,40,.66);
  box-shadow:inset 0 0 9px rgba(var(--accent-rgb),.18); }
.mod .k{ font-size:11px; font-weight:800; letter-spacing:.5px; color:var(--accent); }
.mod .v{ display:block; margin-top:.4em; font-size:1.3em; font-weight:800; }
.mod .v.up{ color:var(--good); } .mod .v.down{ color:var(--bad); } .mod .v.flat{ color:var(--flat); }

/* En pantallas estrechas, una sola columna a buen tamaño. */
@media (max-width:520px){ .slot{ max-width:340px; } }
</style>
</head>
<body>
  <h1>Torre de Leyendas</h1>
  <p class="sub">Cartas · rareza por color — gris = Común · cyan = Rara · magenta = Épica · dorado = Leyenda</p>
  <div class="row" id="cards"></div>

<script>
/* ---- Etiquetas (es) — mismas que data/i18n.js ---------------------------- */
const RARITY    = { common:'Común', rare:'Rara', epic:'Épica', legend:'Leyenda' };
const RAR_CLASS = { common:'rar-common', rare:'rar-rare', epic:'rar-epic', legend:'rar-legend' };
const POSITION  = { GK:'POR', DEF:'DEF', MID:'MED', FWD:'DEL' };
const STAT      = { pace:'RIT', shooting:'TIR', passing:'PAS', dribbling:'REG', defending:'DEF', physical:'FÍS' };
const ITEMTYPE  = { equipamiento:'Equipamiento', tactica:'Táctica', reliquia:'Reliquia' };
const STYLE     = { posesion:'Posesión', presion:'Presión', contra:'Contra' };
const KIND_LABEL = { player:'Jugador', manager:'DT', item:'Objeto' };
const FIELD_STATS = ['pace','shooting','passing','dribbling','defending','physical'];

const PORTRAIT = '../../assets/player-portraits/';
const FLAG     = '../../assets/flags/';

/* ---- Utilidades ----------------------------------------------------------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const SYNERGY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 L9 8 L14 13 L21 5"/><circle cx="21" cy="5" r="1.8" fill="currentColor"/></svg>`;

const statRows = (stats) => FIELD_STATS.map((k) => {
  const v = stats[k];
  return `<div class="stat"><span class="stat-label">${STAT[k]}</span>
    <span class="stat-bar"><span class="stat-fill" style="width:${Math.min(100, v)}%"></span></span>
    <span class="stat-val">${v}</span></div>`;
}).join('');

const mod = (label, pct) => {
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const sign = pct > 0 ? '+' : pct < 0 ? '−' : '';
  return `<div class="mod"><span class="k">${label}</span><span class="v ${cls}">${sign}${Math.abs(pct)}%</span></div>`;
};

const metaRow = (flag, nation, extra) =>
  `<div class="meta">
    <span class="chip"><img class="flag" src="${esc(flag)}" alt="" />${esc(nation)}</span>
    <span class="chip">${esc(extra)}</span>
  </div>`;

const synergyLine = (style) => `Sinergia: ${STYLE[style] || style}`;

/* ---- Contenido por tipo (interior de .content) --------------------------- */
const BODY = {
  player: (p) => `
    <div class="head"><div class="head-left">
      <div class="ovr">${p.ovr}</div><div class="pos-pill">${POSITION[p.position]}</div>
    </div></div>
    <div class="portrait"><div class="inner"><img src="${esc(p.portrait)}" alt="" /></div></div>
    <div class="namebar"><div class="name">${esc(p.name)}</div></div>
    ${metaRow(p.flag, p.nation, p.era)}
    <div class="panel stats">${statRows(p.stats)}</div>`,

  manager: (m) => `
    <div class="head"><div class="badge-dt">DT</div></div>
    <div class="portrait"><div class="inner"><img src="${esc(m.portrait)}" alt="" /></div></div>
    <div class="namebar"><div class="name">${esc(m.name)}</div></div>
    ${metaRow(m.flag, m.nation, m.year)}
    <div class="synergy">${SYNERGY_ICON}${synergyLine(m.style)}</div>
    <div class="mods">${mod('ATA', m.mods.attack)}${mod('MED', m.mods.midfield)}${mod('DEF', m.mods.defense)}</div>`,

  item: (it) => `
    <div class="head"><div class="rarity-wrap"><span class="rarity">${ITEMTYPE[it.type].toUpperCase()}</span></div></div>
    <div class="namebar"><div class="name">${esc(it.name)}</div></div>
    <div class="art"><div class="inner"><span class="icon" aria-hidden="true">${it.icon || '⭐'}</span><span class="ph">arte pendiente</span></div></div>
    <div class="panel desc-box"><p>${esc(it.desc)}</p>${it.synergyType ? `<div class="item-synergy">${synergyLine(it.synergyType)}</div>` : ''}</div>`,
};

const cardHTML = (d) => `
  <div class="slot">
    <span class="tag">${KIND_LABEL[d.kind]} · ${RARITY[d.rarity]}</span>
    <div class="card ${RAR_CLASS[d.rarity]}" style="background-image:url('./${d.bg}')">
      <div class="content">${BODY[d.kind](d)}</div>
    </div>
  </div>`;

/* ---- Datos (forma del juego) --------------------------------------------- */
const CARDS = [
  // —— Jugadores (común · rara · épica · leyenda) ——
  { kind:'player', bg:'card-comun-player-dt.jpg', rarity:'common', name:'García', nation:'España', era:'Cantera',
    position:'MID', ovr:67, stats:{ pace:66, shooting:62, passing:68, dribbling:65, defending:60, physical:67 },
    portrait:PORTRAIT+'base_mid_garcia.png', flag:FLAG+'espana.png' },
  { kind:'player', bg:'card-rara-player-dt.jpg', rarity:'rare', name:'Víctor Muñoz', nation:'España', era:'1986',
    position:'MID', ovr:83, stats:{ pace:81, shooting:81, passing:87, dribbling:83, defending:80, physical:81 },
    portrait:PORTRAIT+'gen_mid_victor-munoz.png', flag:FLAG+'espana.png' },
  { kind:'player', bg:'card-epica-player-dt.jpg', rarity:'epic', name:'Luka Modrić', nation:'Croacia', era:'2018',
    position:'MID', ovr:89, stats:{ pace:86, shooting:89, passing:99, dribbling:88, defending:80, physical:80 },
    portrait:PORTRAIT+'mid_modric_2018.png', flag:FLAG+'croacia.png' },
  { kind:'player', bg:'card-leyenda-player-dt.jpg', rarity:'legend', name:'Giuseppe Signori', nation:'Italia', era:'1994',
    position:'FWD', ovr:91, stats:{ pace:95, shooting:99, passing:75, dribbling:80, defending:77, physical:91 },
    portrait:PORTRAIT+'gen_fwd_giuseppe-signori.png', flag:FLAG+'italia.png' },

  // —— DT (común · rara · épica · leyenda) ——
  { kind:'manager', bg:'card-comun-player-dt.jpg', rarity:'common', name:'Director Técnico', nation:'España', year:2024,
    style:'contra', mods:{ attack:1, midfield:1, defense:0 },
    portrait:PORTRAIT+'manager_director_tecnico.jpg', flag:FLAG+'espana.png' },
  { kind:'manager', bg:'card-rara-player-dt.jpg', rarity:'rare', name:'Jorge Sampaoli', nation:'Argentina', year:2018,
    style:'presion', mods:{ attack:2, midfield:2, defense:0 },
    portrait:PORTRAIT+'manager_jorge_sampaoli.jpg', flag:FLAG+'argentina.png' },
  { kind:'manager', bg:'card-epica-player-dt.jpg', rarity:'epic', name:'Joachim Löw', nation:'Alemania', year:2014,
    style:'posesion', mods:{ attack:2, midfield:2, defense:1 },
    portrait:PORTRAIT+'manager_joachim_low.jpg', flag:FLAG+'alemania.png' },
  { kind:'manager', bg:'card-leyenda-player-dt.jpg', rarity:'legend', name:'Guardiola', nation:'España', year:2009,
    style:'posesion', mods:{ attack:2, midfield:6, defense:0 },
    portrait:PORTRAIT+'manager_guardiola.jpg', flag:FLAG+'espana.png' },

  // —— Objetos (común · rara · épica · leyenda) ——
  { kind:'item', bg:'card-comun-item.jpg', rarity:'common', type:'equipamiento', name:'Botas de cuero', icon:'👟',
    desc:'+1 al ritmo de un jugador.', synergyType:null },
  { kind:'item', bg:'card-rara-item.jpg', rarity:'rare', type:'equipamiento', name:'Botas de oro', icon:'🥾',
    desc:'+2,5 al ataque de la delantera.', synergyType:null },
  { kind:'item', bg:'card-epica-item.jpg', rarity:'epic', type:'tactica', name:'Tiki-taka', icon:'🎯',
    desc:'+4% mediocampo, −2,5% defensa.', synergyType:'posesion' },
  { kind:'item', bg:'card-leyenda-item.jpg', rarity:'legend', type:'reliquia', name:'Duodécimo jugador', icon:'📣',
    desc:'+2 de química de equipo: la grada empuja.', synergyType:null },
];

/* ---- Montaje -------------------------------------------------------------- */
document.getElementById('cards').innerHTML = CARDS.map(cardHTML).join('');
</script>
</body>
</html>
